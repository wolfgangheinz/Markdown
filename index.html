<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Markdown Editor</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css">
</head>
<body>
  <header class="app-header">
    <div class="logo-title">
      <h1>Markdown Studio</h1>
      <label class="sr-only" for="document-title">Document title</label>
      <input type="text" id="document-title" class="document-title-input" value="Untitled" maxlength="120" aria-describedby="document-title-help">
      <span id="document-title-help" class="sr-only">Press Enter or leave the field to save the new name.</span>
    </div>
    <div class="header-groups">
      <div class="pane-toolbar editor-toolbar" role="toolbar" aria-label="Text formatting">
        <div class="toolbar-group" role="group" aria-label="History">
          <button type="button" class="tool-btn tool-btn--icon" data-action="undo" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo">↶</button>
          <button type="button" class="tool-btn tool-btn--icon" data-action="redo" title="Redo (Ctrl/Cmd+Shift+Z)" aria-label="Redo">↷</button>
        </div>
        <div class="toolbar-group" role="group" aria-label="Text style">
          <button type="button" class="tool-btn tool-btn--icon tool-btn--bold" data-action="bold" title="Bold (Ctrl/Cmd+B)" aria-label="Bold">B</button>
          <button type="button" class="tool-btn tool-btn--icon tool-btn--italic" data-action="italic" title="Italic (Ctrl/Cmd+I)" aria-label="Italic">I</button>
          <button type="button" class="tool-btn tool-btn--icon tool-btn--strike" data-action="strikethrough" title="Strikethrough" aria-label="Strikethrough">S</button>
          <button type="button" class="tool-btn tool-btn--icon" data-action="highlight" title="Highlight" aria-label="Highlight text">✦</button>
          <button type="button" class="tool-btn tool-btn--code" data-action="inlineCode" title="Inline code" aria-label="Inline code">&lt;/&gt;</button>
        </div>
        <div class="toolbar-group" role="group" aria-label="Structure">
          <button type="button" class="tool-btn" data-action="heading" title="Heading (Ctrl/Cmd+1)" aria-label="Heading">Heading</button>
          <button type="button" class="tool-btn tool-btn--icon" data-action="ul" title="Bulleted list" aria-label="Bulleted list">☷</button>
          <button type="button" class="tool-btn tool-btn--icon" data-action="ol" title="Numbered list" aria-label="Numbered list">☷₁</button>
          <button type="button" class="tool-btn tool-btn--icon" data-action="quote" title="Quote" aria-label="Quote">❝</button>
        </div>
        <div class="toolbar-group" role="group" aria-label="Insert">
          <button type="button" class="tool-btn tool-btn--icon" data-action="link" title="Insert link (Ctrl/Cmd+K)" aria-label="Insert link">↗</button>
          <button type="button" class="tool-btn tool-btn--icon" data-action="image" title="Insert image" aria-label="Insert image">▧</button>
          <button type="button" class="tool-btn tool-btn--icon" data-action="table" title="Insert table" aria-label="Insert table">▦</button>
          <button type="button" class="tool-btn tool-btn--icon" data-action="code" title="Code block" aria-label="Code block">{ }</button>
        </div>
      </div>
      <details class="app-menu">
        <summary aria-label="Document and export menu">••• <span>File</span></summary>
        <div class="pane-toolbar file-toolbar" role="group" aria-label="File and export actions">
        <button type="button" class="file-btn" data-action="new" title="New document" aria-label="New document">New</button>
        <button type="button" class="file-btn" data-action="open" title="Open" aria-label="Open file">Open</button>
        <button type="button" class="file-btn" data-action="openFolder" title="Open folder" aria-label="Open folder">Open Folder</button>
        <button type="button" class="file-btn" data-action="save" title="Save" aria-label="Save file">Save</button>
        <button type="button" class="file-btn" data-action="saveAs" title="Save As" aria-label="Save file as">Save As</button>
        <button type="button" class="file-btn" data-action="exportHtml" title="Export HTML" aria-label="Export as HTML">Export HTML</button>
        <button type="button" class="file-btn" data-action="print" title="Print / Export PDF" aria-label="Print or export to PDF">Print</button>
        <button type="button" class="file-btn" data-action="copyMd" title="Copy Markdown" aria-label="Copy Markdown">Copy MD</button>
        <button type="button" class="file-btn" data-action="copyRich" title="Copy Rendered HTML" aria-label="Copy rendered HTML">Copy Rich</button>
        <button type="button" class="file-btn" data-action="clearAutosave" title="Clear Autosave" aria-label="Clear autosaved draft">Clear Draft</button>
        <button type="button" class="file-btn" data-action="manageDrafts" title="Manage drafts" aria-label="Manage autosaved drafts">Drafts</button>
        </div>
      </details>
      </div>
      <button type="button" class="theme-toggle" aria-label="Toggle light or dark theme" aria-pressed="false">
        <span class="icon sun" aria-hidden="true">☀</span>
        <span class="icon moon" aria-hidden="true">☾</span>
      </button>
  <div class="view-toggle" role="group" aria-label="Editor view">
      <button type="button" data-view="split" aria-pressed="true">Split</button>
      <button type="button" data-view="wysiwyg" aria-pressed="false">Visual (experimental)</button>
      <button type="button" data-view="editor" aria-pressed="false">Markdown</button>
      <button type="button" data-view="preview" aria-pressed="false">Preview</button>
    </div>
  </header>
  <main class="app-main" id="drop-zone">
    <aside class="file-explorer" aria-label="Folder explorer">
      <div class="file-explorer__header">
        <span>Explorer</span>
        <strong class="file-explorer__name">No folder open</strong>
        <button type="button" class="file-explorer__new-file" data-action="newFolderFile" title="Create Markdown file" aria-label="Create Markdown file" disabled>+</button>
        <button type="button" class="file-explorer__toggle" data-action="toggleExplorer" title="Hide Explorer" aria-label="Hide Explorer" aria-pressed="true">‹</button>
      </div>
      <span class="file-explorer__rail-label" aria-hidden="true">Explorer</span>
      <div class="file-explorer__tree"></div>
      <div class="file-explorer__empty">
        <p class="file-explorer__empty-message">Open a folder to browse Markdown files.</p>
        <button type="button" class="file-btn file-explorer__open-folder">Open Folder</button>
        <button type="button" class="file-btn file-explorer__reconnect" hidden>Reconnect</button>
      </div>
    </aside>
    <div class="explorer-divider" role="separator" aria-orientation="vertical" aria-label="Resize Explorer" aria-valuemin="140" aria-valuemax="480" aria-valuenow="240" tabindex="0"></div>
    <section class="pane editor-pane" aria-label="Markdown editor">
      <textarea id="editor" spellcheck="false" aria-label="Markdown editor"></textarea>
    </section>
    <div class="divider" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize editor and preview panels"></div>
    <section class="pane preview-pane" aria-label="Markdown preview" aria-live="polite">
      <article id="preview" class="markdown-body"></article>
    </section>
  </main>
  <div class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="file-input" accept=".md,.markdown,.txt,.html,.htm" hidden>
  <input type="file" id="folder-input" webkitdirectory multiple hidden>
  <div class="draft-manager" hidden>
    <div class="draft-manager__backdrop" data-action="closeDrafts"></div>
    <div class="draft-manager__dialog" role="dialog" aria-modal="true" aria-labelledby="draft-manager-title">
      <div class="draft-manager__header">
        <h2 id="draft-manager-title">Autosaved Drafts</h2>
        <button type="button" class="file-btn" data-action="closeDrafts" aria-label="Close draft manager">Close</button>
      </div>
      <div class="draft-manager__content">
        <div class="draft-manager__empty" hidden>No drafts yet.</div>
        <ul class="draft-manager__list" role="list"></ul>
      </div>
      <div class="draft-manager__footer">
        <div class="storage-indicator" aria-live="polite">
          <div class="storage-bar" aria-hidden="true"><span></span></div>
          <div class="storage-label">Storage usage: 0%</div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
